name: Build contrast-safe Mai artwork
on:
  push:
    paths:
      - 'scripts/build-contrast-mai.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Preserve exact black ink with light backing for dark themes
        run: python scripts/build-contrast-mai.py
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mai-visible-both.png
          git diff --cached --quiet || (git commit -m "profile: generate high-contrast Mai for both themes" && git push)
