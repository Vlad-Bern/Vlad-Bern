name: Fix light-theme Mai ink
on:
  push:
    paths:
      - 'scripts/fix-light-mai.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python scripts/fix-light-mai.py
      - name: Commit corrected image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mai-black-opaque.png
          git diff --cached --quiet || (git commit -m "profile: darken light-theme Mai ink" && git push)
